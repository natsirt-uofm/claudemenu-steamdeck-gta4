; ClaudeMenu settings - edit with the game closed, or use Settings in the menu.
; Buttons: A B X Y LB RB LT RT START BACK L3 R3 UP DOWN LEFT RIGHT (join with +)
[Controls]
OpenCombo=LB+RB+X
CloseCombo=LB+RB+B
; Hold while driving for nitro (the Deck's back grips can be mapped to L3 in Steam Input)
NitroButton=L3
; The game's jump button, used by Super Jump (X on an Xbox-style pad)
JumpButton=X
FreezePlayerWhileOpen=true
StickNavigation=true
; Keyboard: arrows/Enter/Backspace navigate, toggle key is a Windows virtual-key code (115 = F4)
KeyboardFallback=true
KeyboardToggleKey=115

[Display]
; Position: 0 = left, 1 = center, 2 = right
Position=0
Theme=0
Scale=1.00
MaxVisibleItems=11
SaveOnClose=false
Speedometer=true
SpeedUnits=kmh

[Performance]
; Advanced: multiplies every force the tuning code adds (0.1 - 5.0). Leave at 1.0 unless
; the multipliers feel far too weak or too strong in your setup.
ForceScale=1.00

[Teleport]
; Saved slots are written by the menu (Teleport > Save Position).
; Add your own named locations, one per line:  Location=Name|X|Y|Z
; Location=My Garage|894.0|-500.0|15.0

[Vehicles]
; Presets are written by Vehicles > Presets. You can rename one by editing its first field.
; Preset=Name|Model|ModelHash|Primary|Secondary|Specular|Trim|Extras|Livery|Dirt|Power|Brakes|Grip|Handbrake|TopSpeedKmh
